name: Build and deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pin npm version
        run: |
          npm install --global npm@12.0.1
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check CSS token fallbacks
        run: npm run lint:css-tokens

      - uses: actions/setup-node@v4
        with:
          node-version: 8.9.4

      # Legacy PhantomJS gate retired: it lacks Intl, so qunit:all can
      # no longer validate the suites. This keeps its eslint +
      # webpack + CSS signal; Playwright runs the suites below.
      - name: Build test bundles
        run: npx grunt build-test

      # Demos are build output (gitignored); the axe baseline spec
      # scans demos/demo.html, so build them before Playwright runs.
      - name: Build demo pages
        run: npx grunt build-demos

      - name: Upload coverage
        run: npm run codecov

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The published legacy bundle is the webpack build, so build it before
      # the suites run: the Playwright suites then validate the very artifact
      # that gets uploaded and synced to S3.
      - name: Build deployment files
        run: npm run build:all
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      # After the webpack build: its CleanWebpackPlugin wipes dist/, so the
      # Vite outputs (esm/cjs/umd + staged legacy copy) would not survive
      # otherwise.
      - name: Build Vite bundles
        run: npm run build:vite

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright QUnit suites
        run: npm run test:playwright

      # Guard: the published legacy bundle must stay the webpack flat-global
      # build until #965 migrates consumers to the Vite namespace.
      - name: Check legacy bundle is the webpack build
        run: grep -q webpackUniversalModuleDefinition dist/tablefilter/tablefilter.js

      - name: Upload deployment files
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: website-files
          path: |
            dist/
            docs/
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: website-files

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin npm version
        run: |
          npm install --global npm@12.0.1
          npm --version

      # Publish the bundles built and validated by the `build` job (#1020).
      # 0.7.4 and 0.7.5 were tagged, released and deployed but never
      # published because this step did not exist. Keep it ahead of the S3
      # sync: a failed publish must not leave the website ahead of npm.
      # The version only changes in the release issue, so the guard makes
      # every other master merge a no-op instead of a failed publish.
      # Requires the NPM_TOKEN repository secret: a granular access token
      # with read/write (publish) access to tablefilter.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")

          # Only E404 means "not published yet". Any other failure (network,
          # auth, registry outage) must abort rather than fall through to a
          # publish attempt.
          if view_out=$(npm view "tablefilter@$version" version 2>&1); then
            echo "tablefilter@$version is already published - skipping."
            exit 0
          fi
          if ! grep -q 'E404' <<<"$view_out"; then
            echo "::error::npm view failed for an unexpected reason:"
            echo "$view_out"
            exit 1
          fi

          # Fail closed: an unpublished version without a token must block
          # the release instead of silently skipping the publish (#1020).
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is unset and tablefilter@$version is not on npm yet"
            exit 1
          fi

          # Refuse to publish master's content under a version whose tag
          # points somewhere else: that is how a merge made after a release
          # would ship unreleased code as that release.
          tag_commit=$(git rev-parse -q --verify "refs/tags/$version^{commit}" || true)
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
            echo "::error::tag $version points at $tag_commit, not HEAD - refusing to publish"
            exit 1
          fi

          npm publish --ignore-scripts --tag next

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Publish version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if ! git show-ref --verify --quiet "refs/tags/$version"; then
            latest_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ "$latest_tag" != "$version" ]; then
              git config user.name "koalyptus"
              git config user.email "maxgug@hotmail.com"
              git tag -a "$version" -m "Generated tag from GitHub Actions run $GITHUB_RUN_NUMBER"
              git push origin "refs/tags/$version"
            fi
          fi

          if ! gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$version" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$version" \
              --notes ""
          fi

      - name: Deploy distribution to S3
        run: aws s3 sync dist/ "s3://www.tablefilter.com/"

      - name: Deploy documentation to S3
        run: aws s3 sync docs/ "s3://www.tablefilter.com/"
