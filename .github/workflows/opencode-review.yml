name: opencode-review

# Automatic pull-request review. Runs the opencode CLI directly (v2 CI mode)
# instead of the anomalyco/opencode action: the action refuses runs triggered
# by app bots, while the CLI path has no actor gate, so bot-created PRs get
# reviewed too. The review is posted as github-actions[bot]. Same secret and
# model as opencode.yml.
on:
  pull_request:
    # When the PR first appears or becomes ready — not on every push. Later
    # pushes are covered by the local agent's own checks, and re-reviewing
    # each one stacks duplicate comments.
    types: [opened, reopened, ready_for_review]
  # Manual re-run for a failed review (no close/reopen dance required).
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true

# One review per PR: a reopen cancels a superseded run instead of stacking
# duplicate reviews. Manual dispatches carry their PR in inputs (no
# pull_request context), so fall back to it to keep groups distinct.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped (ready_for_review picks them up when marked ready).
    # Fork PRs are skipped too: secrets are not passed to the runner and
    # GITHUB_TOKEN is forced read-only for them, so the review would only fail.
    # Dependabot PRs are skipped: they run with a read-only token, so the
    # comment step could never post. Manual dispatches always run (the clicker
    # chose the PR explicitly).
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    # Reviews take ~10 minutes; bound a hung agent run instead of holding the
    # concurrency group until the 6-hour default.
    timeout-minutes: 30
    permissions:
      # Read-only on purpose: the reviewer must not commit. The local agent
      # already pushed its edits, and a review-time push would fork history.
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        # Skipped on manual dispatch: the next step checks out the PR head.
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout PR head (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ format('refs/pull/{0}/head', github.event.inputs.pr) }}

      - name: Review with opencode CLI
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          # The CLI prints the reply on stdout and its progress/errors on
          # stderr, so the redirect alone is the comment body; a non-zero exit
          # fails the step and trips "Report review failure" below.
          npm install --global @opencode/cli@2.0.30
          opencode run --standalone --model opencode/big-pickle \
            "Review PR $PR_NUMBER in ${{ github.repository }}. Get the change
            with 'gh pr diff $PR_NUMBER --repo ${{ github.repository }}'
            (GH_TOKEN is set) and review the diff itself; do not run tests.

            Start with 'Review: PR $PR_NUMBER — [verdict]'. Be thorough - check the diff rather than trusting its
            description - and apply the conventions in AGENTS.md. Flag dead
            code or debug output left in the diff. Write only the findings,
            each with file:line and a concrete fix. Skip the narration, the
            restating and the thinking out loud; one line is enough when it
            is sound." > /tmp/review.md
          # Ceiling on a runaway reply: thorough is fine, unbounded is not.
          head -c 20000 /tmp/review.md > /tmp/review.capped.md &&
            mv /tmp/review.capped.md /tmp/review.md
          # An empty reply would make the comment step fail obscurely.
          [ -s /tmp/review.md ] || { echo "review empty: no stdout" >&2; exit 1; }
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" --body-file /tmp/review.md

      - name: Report review failure
        # A silent failure is a missing review with no visible cause; link
        # the failed run instead.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
            --body "Automated review failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
