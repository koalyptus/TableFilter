name: opencode-review

# Automatic pull-request review. Runs the opencode CLI directly (v2 CI mode)
# instead of the anomalyco/opencode action: the action refuses runs triggered
# by app bots, while the CLI path has no actor gate, so bot-created PRs get
# reviewed too. The review is posted as github-actions[bot]. Same secret and
# model as opencode.yml.
on:
  pull_request:
    # When the PR first appears or becomes ready — not on every push. Later
    # pushes are covered by the local agent's own checks, and re-reviewing
    # each one stacks duplicate comments.
    types: [opened, reopened, ready_for_review]
  # Manual re-run for a failed review (no close/reopen dance required).
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true

# One review per PR: a reopen cancels a superseded run instead of stacking
# duplicate reviews. Manual dispatches carry their PR in inputs (no
# pull_request context), so fall back to it to keep groups distinct.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped (ready_for_review picks them up when marked ready).
    # Fork PRs are skipped too: secrets are not passed to the runner and
    # GITHUB_TOKEN is forced read-only for them, so the review would only fail.
    # Manual dispatches always run (the clicker chose the PR explicitly).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Reviews take ~10 minutes; bound a hung agent run instead of holding the
    # concurrency group until the 6-hour default.
    timeout-minutes: 30
    permissions:
      # Read-only on purpose: the reviewer must not commit. The local agent
      # already pushed its edits, and a review-time push would fork history.
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout PR head (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ format('refs/pull/{0}/head', github.event.inputs.pr) }}

      - name: Review with opencode CLI
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          npm install --global @opencode/cli@2.0.30
          opencode run --standalone --model opencode/big-pickle --format json \
            "Review this pull request against the repository conventions in
            AGENTS.md and the plan in ROADMAP/. Start by running 'gh pr diff
            $PR_NUMBER --repo ${{ github.repository }}'
            (GH_TOKEN is set); that output is the change under review.

            Start your reply with the heading '## Review'.

            Report only findings you can substantiate from the diff or the
            surrounding code, each with file:line and a concrete fix. If the
            change is sound, say so plainly instead of inventing nits.

            Check for:
            - Correctness: bugs, edge cases, error handling, and
              compatibility with the environments the code actually runs in
              (browsers via the Playwright runner, Node 8 + PhantomJS for
              the legacy QUnit path, Node 24 builds).
            - Scope: one issue per small PR. Flag unrelated changes, dead
              code, leftover debug output and duplicated logic.
            - Temporary code: compat aliases and shims must carry a
              TODO(#<issue>) comment naming the issue that removes them.
            - Tests: new behaviour needs a gate that fails without the
              change. State explicitly when verification evidence is missing
              or when a test cannot fail.
            - Housekeeping: the PR body references its issue (Closes/Refs),
              and no package.json version bump in a feature PR.
            - Security: injection, hardcoded secrets, unsafe
              deserialization, eval/exec." \
            | node -e '
            // JSONL events: post only reply text parts, never transcript
            // (tool/reasoning events). Fail on error events or empty output.
            const fs = require("fs");
            const texts = [];
            for (const line of fs.readFileSync(0, "utf8").split("\n")) {
              const s = line.trim();
              if (!s) continue;
              let ev;
              try { ev = JSON.parse(s); } catch (e) { continue; }
              if (ev && ev.type === "text") {
                const t = ev.part && ev.part.text;
                if (t && t.trim()) texts.push(t.trim());
              } else if (ev && ev.type === "error") {
                console.error("review error: " + ((ev.error && ev.error.message) || "unknown"));
                process.exit(1);
              }
            }
            let body = texts.join("\n\n").trim();
            if (!body) { console.error("review empty: no text parts"); process.exit(1); }
            const cap = 50000;
            if (body.length > cap) body = body.slice(0, cap) + "\n\n...[truncated: review exceeded 50KB cap]...";
            process.stdout.write(body);
            ' > /tmp/review.md
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" --body-file /tmp/review.md

      - name: Report review failure
        # A silent failure is a missing review with no visible cause; link
        # the failed run instead.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
            --body "Automated review failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
