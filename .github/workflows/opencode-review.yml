name: opencode-review

# Automatic pull-request review. Authenticates with this workflow's GITHUB_TOKEN
# (passed as TOKEN, which the action also treats as its actor-gate bypass), so
# no OIDC exchange and no OpenCode GitHub App install required. The review is
# posted as github-actions[bot]. Same secret and model as opencode.yml.
on:
  pull_request:
    # Once, when the PR first appears — not on every push. Later pushes are
    # covered by the local agent's own checks, and re-reviewing each one stacks
    # duplicate comments.
    types: [opened, reopened]

# One review per PR: a reopen cancels a superseded run instead of stacking
# duplicate reviews.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped. Fork PRs are skipped too: secrets are not passed to
    # the runner and GITHUB_TOKEN is forced read-only for them, so the review
    # would only fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # Read-only on purpose: the reviewer must not commit. The local agent
      # already pushed its edits, and a review-time push would fork history.
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode review
        # Kept on @latest to match .github/workflows/opencode.yml. Pinning the
        # action to a commit SHA is a repo-wide change, better done in its own
        # issue than here.
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action reads TOKEN as its GitHub access token and skips its
          # actor-write gate only when TOKEN is set. Same value as
          # GITHUB_TOKEN, no new secret.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          # No `agent:` pin: the default build agent is used. Its git access is
          # bounded by the read-only permissions above, so it reviews and
          # replies rather than pushing fixes.
          prompt: |
            Review this pull request against the repository conventions in
            AGENTS.md and the plan in ROADMAP/.

            Report only findings you can substantiate from the diff or the
            surrounding code, each with file:line and a concrete fix. If the
            change is sound, say so plainly instead of inventing nits.

            Check for:
            - Correctness: bugs, edge cases, error handling, and
              compatibility with the environments the code actually runs in
              (browsers via the Playwright runner, Node 8 + PhantomJS for
              the legacy QUnit path, Node 24 builds).
            - Scope: one issue per small PR. Flag unrelated changes, dead
              code, leftover debug output and duplicated logic.
            - Temporary code: compat aliases and shims must carry a
              TODO(#<issue>) comment naming the issue that removes them.
            - Tests: new behaviour needs a gate that fails without the
              change. State explicitly when verification evidence is missing
              or when a test cannot fail.
            - Housekeeping: the PR body references its issue (Closes/Refs),
              and no package.json version bump in a feature PR.
            - Security: injection, hardcoded secrets, unsafe
              deserialization, eval/exec.
