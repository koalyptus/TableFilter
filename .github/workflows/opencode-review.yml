name: opencode-review

# Automatic pull-request review. Runs in use_github_token mode: no OIDC token
# exchange and no OpenCode GitHub App install required. The review is posted
# with this workflow's GITHUB_TOKEN, i.e. as github-actions[bot]. Same secret
# and model as the mention handler in opencode.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR: a new push cancels the superseded run instead of
# stacking duplicate reviews.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped on open/synchronize and picked up by ready_for_review.
    # Fork PRs are skipped too: secrets are not passed to the runner and
    # GITHUB_TOKEN is forced read-only for them, so the review would only fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # contents: write lets the reviewer commit small fixes to the PR branch;
      # pull-requests/issues: write let it post the review and reply.
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode review
        # Kept on @latest to match .github/workflows/opencode.yml. Pinning the
        # action to a commit SHA is a repo-wide change, better done in its own
        # issue than here.
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          # No `agent:` pin: the default build agent is intentional so the
          # reviewer can apply small fixes, not just comment (contents: write
          # above lets it push them to the PR branch).
          use_github_token: true
          prompt: |
            Review this pull request against the repository conventions in
            AGENTS.md and the plan in ROADMAP/.

            Report only findings you can substantiate from the diff or the
            surrounding code, each with file:line and a concrete fix. If the
            change is sound, say so plainly instead of inventing nits.

            Check for:
            - Correctness: bugs, edge cases, error handling, and
              compatibility with the environments the code actually runs in
              (browsers via the Playwright runner, Node 8 + PhantomJS for
              the legacy QUnit path, Node 24 builds).
            - Scope: one issue per small PR. Flag unrelated changes, dead
              code, leftover debug output and duplicated logic.
            - Temporary code: compat aliases and shims must carry a
              TODO(#<issue>) comment naming the issue that removes them.
            - Tests: new behaviour needs a gate that fails without the
              change. State explicitly when verification evidence is missing
              or when a test cannot fail.
            - Housekeeping: the PR body references its issue (Closes/Refs),
              and no package.json version bump in a feature PR.
            - Security: injection, hardcoded secrets, unsafe
              deserialization, eval/exec.
